<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>만화경 드로잉</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    background: #0a0a0f;
    color: #f0ede8;
    font-family: -apple-system, "Segoe UI", "Malgun Gothic", sans-serif;
    height: 100%;
    overflow: hidden;
  }
  #stage {
    position: relative;
    width: 100vw;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  canvas {
    background: #0a0a0f;
    border-radius: 50%;
    box-shadow: 0 0 60px rgba(120, 80, 255, 0.15), inset 0 0 0 1px rgba(255,255,255,0.06);
    touch-action: none;
    cursor: crosshair;
  }
  #panel {
    position: fixed;
    top: 20px;
    left: 20px;
    background: rgba(23, 23, 29, 0.85);
    backdrop-filter: blur(8px);
    border: 1px solid #2a2a32;
    border-radius: 16px;
    padding: 16px 18px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    font-size: 13px;
    width: 200px;
  }
  #panel h1 { font-size: 14px; font-weight: 600; margin-bottom: 2px; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 8px; color: #a8a8b0; }
  .row input[type="range"] { flex: 1; accent-color: #ff6b4a; }
  .row span { width: 24px; text-align: right; color: #f0ede8; }
  #buttons { display: flex; gap: 8px; }
  #buttons button {
    flex: 1;
    background: #2a2a32;
    border: none;
    color: #f0ede8;
    padding: 8px 0;
    border-radius: 10px;
    font-size: 13px;
    cursor: pointer;
  }
  #buttons button.primary { background: #ff6b4a; color: #1a0f0a; font-weight: 600; }
  #hint {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    color: #6a6a72;
    font-size: 12px;
    pointer-events: none;
  }
</style>
</head>
<body>
<div id="stage">
  <canvas id="canvas"></canvas>
</div>

<div id="panel">
  <h1>🔮 만화경 드로잉</h1>
  <div class="row">대칭 <input id="symRange" type="range" min="3" max="24" value="10"><span id="symVal">10</span></div>
  <div class="row">굵기 <input id="widthRange" type="range" min="1" max="20" value="4"><span id="widthVal">4</span></div>
  <div class="row">색상 회전 <input id="hueRange" type="range" min="0" max="10" value="2"><span id="hueVal">2</span></div>
  <div id="buttons">
    <button id="clearBtn">지우기</button>
    <button id="saveBtn" class="primary">저장</button>
  </div>
</div>
<div id="hint">마우스나 손가락으로 그려보세요 — 대칭 패턴이 자동으로 생성됩니다</div>

<script>
(function () {
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');
  const stage = document.getElementById('stage');

  function resize() {
    const size = Math.min(window.innerWidth, window.innerHeight) * 0.9;
    const prev = ctx.getImageData ? null : null;
    canvas.width = size;
    canvas.height = size;
  }
  resize();
  window.addEventListener('resize', resize);

  let symmetry = 10;
  let lineWidth = 4;
  let hueSpeed = 2;
  let hue = 200;

  const symRange = document.getElementById('symRange');
  const symVal = document.getElementById('symVal');
  const widthRange = document.getElementById('widthRange');
  const widthVal = document.getElementById('widthVal');
  const hueRange = document.getElementById('hueRange');
  const hueVal = document.getElementById('hueVal');

  symRange.addEventListener('input', () => { symmetry = +symRange.value; symVal.textContent = symmetry; });
  widthRange.addEventListener('input', () => { lineWidth = +widthRange.value; widthVal.textContent = lineWidth; });
  hueRange.addEventListener('input', () => { hueSpeed = +hueRange.value; hueVal.textContent = hueSpeed; });

  let drawing = false;
  let lastX = 0, lastY = 0;

  function getPos(e) {
    const rect = canvas.getBoundingClientRect();
    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    const clientY = e.touches ? e.touches[0].clientY : e.clientY;
    return {
      x: (clientX - rect.left) * (canvas.width / rect.width),
      y: (clientY - rect.top) * (canvas.height / rect.height)
    };
  }

  function start(e) {
    drawing = true;
    const p = getPos(e);
    lastX = p.x;
    lastY = p.y;
  }

  function stop() { drawing = false; }

  function draw(e) {
    if (!drawing) return;
    e.preventDefault();
    const p = getPos(e);
    const cx = canvas.width / 2;
    const cy = canvas.height / 2;

    const dx0 = lastX - cx, dy0 = lastY - cy;
    const dx1 = p.x - cx, dy1 = p.y - cy;
    const r0 = Math.hypot(dx0, dy0), a0 = Math.atan2(dy0, dx0);
    const r1 = Math.hypot(dx1, dy1), a1 = Math.atan2(dy1, dx1);

    hue = (hue + hueSpeed) % 360;
    ctx.lineWidth = lineWidth;
    ctx.lineCap = 'round';
    ctx.strokeStyle = `hsl(${hue}, 85%, 65%)`;
    ctx.shadowColor = `hsl(${hue}, 85%, 65%)`;
    ctx.shadowBlur = 6;

    const step = (Math.PI * 2) / symmetry;
    for (let i = 0; i < symmetry; i++) {
      const angle = step * i;
      // rotated
      const x0 = cx + r0 * Math.cos(a0 + angle);
      const y0 = cy + r0 * Math.sin(a0 + angle);
      const x1 = cx + r1 * Math.cos(a1 + angle);
      const y1 = cy + r1 * Math.sin(a1 + angle);
      ctx.beginPath();
      ctx.moveTo(x0, y0);
      ctx.lineTo(x1, y1);
      ctx.stroke();

      // mirrored
      const mx0 = cx + r0 * Math.cos(-a0 + angle);
      const my0 = cy + r0 * Math.sin(-a0 + angle);
      const mx1 = cx + r1 * Math.cos(-a1 + angle);
      const my1 = cy + r1 * Math.sin(-a1 + angle);
      ctx.beginPath();
      ctx.moveTo(mx0, my0);
      ctx.lineTo(mx1, my1);
      ctx.stroke();
    }

    lastX = p.x;
    lastY = p.y;
  }

  canvas.addEventListener('mousedown', start);
  canvas.addEventListener('mousemove', draw);
  window.addEventListener('mouseup', stop);
  canvas.addEventListener('touchstart', start, { passive: false });
  canvas.addEventListener('touchmove', draw, { passive: false });
  canvas.addEventListener('touchend', stop);

  document.getElementById('clearBtn').addEventListener('click', () => {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
  });

  document.getElementById('saveBtn').addEventListener('click', () => {
    const link = document.createElement('a');
    link.download = 'kaleidoscope-' + Date.now() + '.png';
    link.href = canvas.toDataURL('image/png');
    link.click();
  });
})();
</script>
</body>
</html>
